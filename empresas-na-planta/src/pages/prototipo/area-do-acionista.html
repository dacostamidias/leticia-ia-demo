<h1 class="sr-only">Área do acionista</h1>
<div class="container app" data-acionista>
  <div class="app__side">
    <div class="app__user">
      <span class="avatar" aria-hidden="true"><svg class="icon"><use href="#i-user"/></svg></span>
      <div><p class="small" style="font-weight:600" data-nome>Carregando…</p><p class="tiny muted">Protótipo</p></div>
    </div>
    <div class="mode-switch" role="group" aria-label="Dados exibidos no protótipo">
      <button type="button" data-modo="exemplo" aria-pressed="true">Exemplo ilustrativo</button>
      <button type="button" data-modo="conta-nova" aria-pressed="false">Conta nova</button>
    </div>
    <div role="tablist" aria-label="Seções da área do acionista" aria-orientation="vertical" class="app__nav">
      <button role="tab" id="tab-visao-geral" data-tela="visao-geral" aria-controls="painel" aria-selected="true"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg>Visão geral</button>
      <button role="tab" id="tab-participacoes" data-tela="participacoes" aria-controls="painel" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-building"/></svg>Participações</button>
      <button role="tab" id="tab-pagamentos" data-tela="pagamentos" aria-controls="painel" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-cash"/></svg>Pagamentos</button>
      <button role="tab" id="tab-resultados" data-tela="resultados" aria-controls="painel" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-trend"/></svg>Resultados</button>
      <button role="tab" id="tab-documentos" data-tela="documentos" aria-controls="painel" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg>Documentos</button>
      <button role="tab" id="tab-relatorios" data-tela="relatorios" aria-controls="painel" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg>Relatórios</button>
      <button role="tab" id="tab-comunicados" data-tela="comunicados" aria-controls="painel" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg>Comunicados <span class="count-badge" data-badge-comunicados hidden></span></button>
      <button role="tab" id="tab-suporte" data-tela="suporte" aria-controls="painel" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-support"/></svg>Suporte</button>
      <button role="tab" id="tab-seguranca" data-tela="seguranca" aria-controls="painel" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg>Perfil e segurança</button>
    </div>
  </div>

  <div class="app__main">
    <div class="notice notice--example" role="note" data-exemplo-aviso hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>
      <p><strong>Exemplo ilustrativo com dados fictícios.</strong> A pessoa, os valores e os documentos foram inventados para mostrar como a área funciona. Não representam resultados reais de nenhuma empresa.</p>
    </div>
    <section role="tabpanel" id="painel" class="app__panel" tabindex="-1" aria-labelledby="tab-visao-geral" data-painel-conteudo>
      <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
      <noscript><p>Esta área precisa de JavaScript ativado.</p></noscript>
    </section>
  </div>
</div>

<dialog class="dialog" data-dialog-detalhe aria-labelledby="dlg-titulo">
  <div class="dialog__head">
    <h2 id="dlg-titulo" class="t-xl" data-dialog-titulo>Participação</h2>
    <button class="menu-toggle dialog__close" type="button" data-dialog-fechar><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg><span class="sr-only">Fechar</span></button>
  </div>
  <div class="dialog__body stack" data-dialog-corpo></div>
</dialog>
