<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<meta name="robots" content="{{page.robots}}">
<link rel="canonical" href="{{page.canonical}}">
<meta name="theme-color" content="#0a1b3d">
<meta name="format-detection" content="telephone=no">
<link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/playfair-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{asset.css}}">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{page.canonical}}">
<meta property="og:image" content="{{page.ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
{{page.jsonld}}
<script defer src="{{asset.js}}"></script>
</head>
<body class="{{page.bodyClass}}">
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
{{> icons}}
{{> header}}
<main id="conteudo" tabindex="-1">
{{content}}
</main>
{{> footer}}
<div class="mobile-cta" data-mobile-cta aria-hidden="true">
  <a class="btn btn--outline btn--sm" href="{{site.portal.login}}" tabindex="-1">Entrar</a>
  <a class="btn btn--primary btn--sm" href="{{site.portal.cadastro}}" tabindex="-1">Quero ser acionista</a>
</div>
<div class="toast" role="status" aria-live="polite" data-toast></div>
</body>
</html>
